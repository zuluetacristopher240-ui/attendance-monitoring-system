<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Take Attendance - Attendance Monitoring System">
  <meta name="theme-color" content="#1B2A4A">
  <title>Take Attendance - Attendance Monitoring System</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/attendance.css">
  <link rel="stylesheet" href="../css/students.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar">
      <h2>SCI</h2>
      <nav>
        <a href="teacher-dashboard.html">📊 Dashboard</a>
        <a href="teacher-attendance.html" class="active">✏️ Take Attendance</a>
        <a href="#" id="logoutBtn">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
          <h1>Take Attendance</h1>
        </div>
        <span id="welcomeUser">Welcome!</span>
        <div id="toastContainer" class="toast-container"></div>
      </header>

      <div class="date-bar">
        <label for="attendanceDate">Select Date:</label>
        <input type="date" id="attendanceDate">
        <span id="summaryText"></span>
      </div>

      <div class="checkin-box" style="margin-bottom: 20px;">
        <h3>Generate Check-In Code</h3>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="classSelect" style="display:block; margin-bottom: 5px; font-size: 14px;">Class</label>
          <select id="classSelect" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
            <option value="">-- Select Class --</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 12px;">
          <label for="subjectSelect" style="display:block; margin-bottom: 5px; font-size: 14px;">Subject</label>
          <select id="subjectSelect" disabled style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
            <option value="">-- Select Class First --</option>
          </select>
        </div>

        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <div class="form-group" style="flex: 1;">
            <label for="startTime" style="display:block; margin-bottom: 5px; font-size: 14px;">Start Time</label>
            <input type="time" id="startTime" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="endTime" style="display:block; margin-bottom: 5px; font-size: 14px;">End Time</label>
            <input type="time" id="endTime" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
          </div>
        </div>

        <button id="generateCodeBtn" class="btn-primary">Generate Check-In Code</button>
        <div id="codeDisplay" class="code-display hidden" style="margin-top: 12px;">
          <span id="codeText"></span>
          <span id="codeTimer"></span>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="students-table">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Full Name</th>
              <th>Year & Section</th>
              <th>Status</th>
              <th>Time In</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody">
            <tr class="loading-row">
              <td colspan="6" style="text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p style="color: #999; margin-top: 10px;">Loading attendance...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; background: #D64550; color: white; font-family: Arial;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to use the Attendance Monitoring System.</p>
    </div>
  </noscript>

  <!-- Utils — LOAD FIRST -->
  <script src="../js/utils/escapeHtml.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/sidebar.js"></script>

  <!-- Page-specific -->
  <script src="../js/teacher-attendance.js"></script>
</body>
</html>
