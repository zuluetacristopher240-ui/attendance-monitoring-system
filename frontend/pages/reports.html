<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Attendance Reports - Attendance Monitoring System">
  <meta name="theme-color" content="#1B2A4A">
  <title>Reports - Attendance Monitoring System</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/attendance.css">
  <link rel="stylesheet" href="../css/students.css">
  <link rel="stylesheet" href="../css/reports.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar">
      <h2>SCI</h2>
      <nav>
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="student-management.html">👥 Manage Students</a>
        <a href="admin-classes.html">📚 Manage Classes</a>
        <a href="attendance.html">📋 Attendance Records</a>
        <a href="reports.html" class="active">📈 Reports</a>
        <a href="#" id="logoutBtn">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
          <h1>Attendance Reports</h1>
        </div>
        <span id="welcomeUser">Welcome!</span>
        <div id="toastContainer" class="toast-container"></div>
      </header>

      <div class="date-bar">
        <label for="startDate">From:</label>
        <input type="date" id="startDate">
        <label for="endDate">To:</label>
        <input type="date" id="endDate">
        <button id="filterBtn" class="btn-primary">Filter</button>
        <button id="clearFilterBtn" class="btn-secondary">Show All</button>
      </div>

      <div class="table-wrapper">
        <table class="students-table">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Full Name</th>
              <th>Year & Section</th>
              <th>Present</th>
              <th>Late</th>
              <th>Absent</th>
            </tr>
          </thead>
          <tbody id="reportsTableBody">
            <tr class="loading-row">
              <td colspan="6" style="text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p style="color: #999; margin-top: 10px;">Loading report...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; background: #D64550; color: white; font-family: Arial;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to use the Attendance Monitoring System.</p>
    </div>
  </noscript>

  <!-- Utils — LOAD FIRST -->
  <script src="../js/utils/escapeHtml.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/sidebar.js"></script>

  <!-- Page-specific -->
  <script src="../js/reports.js"></script>
</body>
</html>
