<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Subjects - Attendance Monitoring System">
  <meta name="theme-color" content="#800000">
  <title>My Subjects - Attendance Monitoring System</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/students.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar">
      <h2>SCI</h2>
      <nav>
        <a href="teacher-dashboard.html"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a>
        <a href="teacher-subjects.html" class="active"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> My Subjects</a>
        <a href="teacher-attendance.html"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Take Attendance</a>
        <a href="#" id="logoutBtn"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
          <h1>My Subjects</h1>
        </div>
        <span id="welcomeUser">Welcome!</span>
        <div id="toastContainer" class="toast-container"></div>
      </header>

      <div class="action-bar">
        <button id="addSubjectBtn" class="btn-primary">+ Add Subject</button>
      </div>

      <div class="table-wrapper">
        <table class="students-table">
          <thead>
            <tr>
              <th>Subject Code</th>
              <th>Subject Name</th>
              <th>Class</th>
              <th>Enrollment Code</th>
              <th>Enrolled</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="subjectsTableBody">
            <tr class="loading-row">
              <td colspan="6" style="text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p style="color: #999; margin-top: 10px;">Loading subjects...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- ✅ SUBJECT MODAL -->
  <div id="subjectModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="subjectModalTitle">Add Subject</h2>
      <form id="subjectForm">
        <input type="hidden" id="subjectDbId">
        <div class="form-group">
          <label>Class</label>
          <select id="subjectClass" required style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
            <option value="">-- Select Class --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Subject Code</label>
          <input type="text" id="subjectCode" placeholder="e.g. CS403" required>
        </div>
        <div class="form-group">
          <label>Subject Name</label>
          <input type="text" id="subjectName" placeholder="e.g. Data Structures" required>
        </div>
        <div class="form-group">
          <label>Enrollment Code (optional)</label>
          <input type="text" id="subjectEnrollmentCode" placeholder="Auto-generated kung walang laman">
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelSubjectBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; background: #D64550; color: white; font-family: Arial;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to use the Attendance Monitoring System.</p>
    </div>
  </noscript>

  <!-- Utils — LOAD FIRST -->
  <script src="../js/utils/escapeHtml.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/sidebar.js"></script>

  <!-- Page-specific -->
  <script src="../js/teacher-subjects.js"></script>
</body>
</html>
