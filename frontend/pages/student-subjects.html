<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Subjects - SCI Attendance Monitoring System">
  <meta name="theme-color" content="#800000">
  <title>My Subjects - SCI Attendance Monitoring System</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/attendance.css">
  <link rel="stylesheet" href="../css/students.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar">
      <h2>SCI</h2>
      <nav>
        <a href="student-dashboard.html">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M9 12h6"/>
            <path d="M9 16h6"/>
          </svg>
          My Attendance
        </a>
        <a href="student-subjects.html" class="active">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          My Subjects
        </a>
        <a href="#" id="logoutBtn">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
          <h1>My Subjects</h1>
        </div>
        <span id="welcomeUser">Welcome!</span>
        <div id="toastContainer" class="toast-container"></div>
      </header>

      <!-- MY SUBJECTS SECTION -->
      <div class="checkin-box" style="margin-bottom: 20px;">
        <h3>📚 Enrolled Subjects</h3>
        <div id="subjectsList" style="padding: 10px 0;">
          <p style="color: #999; font-size: 13px;">Loading subjects...</p>
        </div>
      </div>

      <!-- JOIN NEW SUBJECT SECTION -->
      <div class="checkin-box" style="margin-bottom: 20px;">
        <h3>🔓 Join New Subject</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">
          Have a code from your teacher? Enter it here to join and check-in.
        </p>
        <div class="checkin-form">
          <input type="text" id="joinNewCode" placeholder="Enter 6-character code" maxlength="6">
          <button id="joinNewBtn" class="btn-primary">Join</button>
        </div>
        <p id="joinNewMessage"></p>
      </div>
    </main>
  </div>

  <!-- ✅ JOIN CLASS MODAL -->
  <div id="joinModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="joinModalTitle">Join Class</h2>
      <form id="joinForm">
        <p style="font-size: 13px; color: #666; margin-bottom: 15px;" id="joinModalSubtitle">
          Enter the code from your teacher.
        </p>
        <div class="form-group">
          <label>Check-In Code</label>
          <input type="text" id="joinModalCode" placeholder="e.g. ABC123" maxlength="6" required style="text-transform: uppercase; letter-spacing: 3px; font-size: 18px;">
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelJoinBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Check In</button>
        </div>
      </form>
    </div>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; background: #D64550; color: white; font-family: Arial;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to use the Attendance Monitoring System.</p>
    </div>
  </noscript>

  <!-- Utils — LOAD FIRST -->
  <script src="../js/utils/escapeHtml.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/sidebar.js"></script>

  <!-- Page-specific -->
  <script src="../js/student-subjects.js"></script>
</body>
</html>
