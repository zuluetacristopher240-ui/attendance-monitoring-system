<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Attendance - Attendance Monitoring System">
  <meta name="theme-color" content="#1B2A4A">
  <title>My Attendance - Attendance Monitoring System</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/attendance.css">
  <link rel="stylesheet" href="../css/students.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <h2>AMS</h2>
      <nav>
        <a href="student-dashboard.html" class="active">My Attendance</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>My Attendance Record</h1>
        <span id="welcomeUser">Welcome!</span>
        <div id="toastContainer" class="toast-container"></div>
      </header>

      <div class="checkin-box">
        <h3>Enter Check-In Code</h3>
        <div class="checkin-form">
          <input type="text" id="checkInCode" placeholder="Enter 6-character code" maxlength="6">
          <button id="checkInBtn" class="btn-primary">Check In</button>
        </div>
        <p id="checkInMessage"></p>
      </div>

      <!-- ✅ BAGONG SECTION: My Subjects -->
      <div class="checkin-box" style="margin-bottom: 20px;">
        <h3>My Subjects</h3>
        <div id="subjectsList" style="padding: 10px 0;">
          <p style="color: #999; font-size: 13px;">Loading subjects...</p>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="students-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Status</th>
              <th>Time In</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody id="myAttendanceTableBody">
            <tr class="loading-row">
              <td colspan="4" style="text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p style="color: #999; margin-top: 10px;">Loading attendance...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; background: #D64550; color: white; font-family: Arial;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to use the Attendance Monitoring System.</p>
    </div>
  </noscript>

  <!-- Utils — LOAD FIRST -->
  <script src="../js/utils/escapeHtml.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/toast.js"></script>

  <!-- Page-specific -->
  <script src="../js/student-dashboard.js"></script>
</body>
</html>
