<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Teacher Dashboard - Attendance Monitoring System">
  <meta name="theme-color" content="#1B2A4A">
  <title>Teacher Dashboard - Attendance Monitoring System</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/attendance.css">
  <link rel="stylesheet" href="../css/students.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar">
      <h2>SCI</h2>
      <nav>
        <a href="teacher-dashboard.html" class="active">📊 Dashboard</a>
        <a href="teacher-attendance.html">✏️ Take Attendance</a>
        <a href="#" id="logoutBtn">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
          <h1>Teacher Dashboard</h1>
        </div>
        <span id="welcomeUser">Welcome!</span>
        <div id="toastContainer" class="toast-container"></div>
      </header>

      <section class="stats-grid">
        <div class="stat-card">
          <h3>Total Students</h3>
          <p id="totalStudents">0</p>
        </div>
        <div class="stat-card">
          <h3>Present Today</h3>
          <p id="presentToday">0</p>
        </div>
        <div class="stat-card">
          <h3>Absent Today</h3>
          <p id="absentToday">0</p>
        </div>
        <div class="stat-card">
          <h3>Late Today</h3>
          <p id="lateToday">0</p>
        </div>
      </section>

      <section class="recent-activity">
        <h2>Quick Actions</h2>
        <p>Use "Take Attendance" from the sidebar to mark today's attendance.</p>
      </section>
    </main>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; background: #D64550; color: white; font-family: Arial;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to use the Attendance Monitoring System.</p>
    </div>
  </noscript>

  <!-- Utils — LOAD FIRST -->
  <script src="../js/utils/escapeHtml.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/sidebar.js"></script>

  <!-- Page-specific -->
  <script src="../js/teacher-dashboard.js"></script>
</body>
</html>
