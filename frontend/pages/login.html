<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login - Santa Cruz Institute Attendance Monitoring System">
  <meta name="theme-color" content="#800000">
  <title>Login - SCI Attendance Monitoring System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="page-bg">
    <!-- Animated background elements -->
    <div class="hero-glow"></div>
    <div class="floaters">
      <span class="floater f1">✓</span>
      <span class="floater f2">✓</span>
      <span class="floater f3">✓</span>
      <span class="floater f4">✓</span>
      <span class="floater f5">✓</span>
      <span class="floater f6">✓</span>
      <span class="floater f7">✓</span>
      <span class="floater f8">✓</span>
    </div>

    <div class="page-content">

      <!-- ROLE SELECTOR -->
      <div class="login-container glass" id="roleSelector">
        <div class="brand">
          <h1 class="brand-logo">SCI</h1>
          <p class="brand-name">Santa Cruz Institute</p>
          <p class="brand-sub">Attendance Monitoring System</p>
        </div>

        <h2>Welcome back</h2>
        <p class="subtitle">Please select your role to continue</p>

        <div class="role-buttons">
          <button type="button" class="role-btn" id="teacherRoleBtn" aria-label="Login as Teacher">
            <span class="role-icon" aria-hidden="true">👩‍🏫</span>
            Teacher
          </button>
          <button type="button" class="role-btn" id="studentRoleBtn" aria-label="Login as Student">
            <span class="role-icon" aria-hidden="true">🎓</span>
            Student
          </button>
        </div>

        <p class="admin-link">Are you an administrator? <a href="#" id="adminRoleLink">Click here</a></p>
        <p class="admin-link">New here? <a href="signup.html">Create an account</a></p>
      </div>

      <!-- LOGIN FORM -->
      <div class="login-container glass hidden" id="loginFormContainer">
        <div class="brand-mini">
          <span class="brand-mini-logo">SCI</span>
        </div>
        <h2 id="loginTitle">Login</h2>
        <p class="subtitle" id="loginSubtitle">Enter your credentials</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" 
                   autocomplete="username" required autofocus>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" 
                     autocomplete="current-password" required>
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                <span class="eye-icon">👁</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
          </div>

          <button type="submit" id="loginSubmitBtn">
            <span class="btn-text">Login</span>
            <span class="btn-spinner hidden">⏳</span>
          </button>

          <p id="errorMessage" class="error"></p>
          <p class="back-link"><a href="#" id="backBtn">← Back to role selection</a></p>
        </form>
      </div>

    </div>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; background: #D64550; color: white; font-family: Arial;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to use the Attendance Monitoring System.</p>
    </div>
  </noscript>

  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
