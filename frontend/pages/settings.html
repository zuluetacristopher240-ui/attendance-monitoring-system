    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle">☰</button>
          <h1>Account Settings</h1>
        </div>
        <span id="welcomeUser">Welcome!</span>
        <div id="toastContainer" class="toast-container"></div>
      </header>

      <div class="checkin-box" style="max-width: 500px;">
        <h3>Change Username / Password</h3>
        <form id="settingsForm" style="margin-top: 15px;">
          <div class="form-group">
            <label>New Username (Leave blank to keep current)</label>
            <input type="text" id="newUsername" placeholder="Enter new username" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
          </div>
          <div class="form-group" style="margin-top: 15px;">
            <label>New Password (Leave blank to keep current)</label>
            <input type="password" id="newPassword" placeholder="Enter new password" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
          </div>
          <button type="submit" class="btn-primary" style="margin-top: 20px;">Update Profile</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/utils/toast.js"></script>
  <script src="/js/utils/sidebar.js"></script>
  <script>
    const user = requireAuth(['admin']);
    setupLogout();

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newUsername = document.getElementById('newUsername').value.trim();
      const newPassword = document.getElementById('newPassword').value;

      if (!newUsername && !newPassword) {
        showToast('Please enter a new username or password.', 'late');
        return;
      }

      try {
        await API.put('/api/auth/update-admin', { newUsername, newPassword });
        showToast('✅ Profile updated! Please login again.', 'present');
        
        setTimeout(() => {
          clearAuth();
          window.location.href = '/pages/login.html';
        }, 2000);

      } catch (error) {
        showToast('❌ ' + error.message, 'absent');
      }
    });
  </script>
</body>
</html>
